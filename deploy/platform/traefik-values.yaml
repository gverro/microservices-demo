# Traefik ingress controller for the local kind cluster (chart traefik/traefik, version pinned in scripts/install.sh).
# Traffic path: Windows/WSL localhost:80 -> kind extraPortMappings -> node port 80 -> hostPort -> Traefik pod.
# No LoadBalancer on kind, so the Service is ClusterIP and the pod binds the node ports directly.
deployment:
  replicas: 1
# hostPort 80/443 on a single node: a new pod cannot start while the old one holds the ports, so the default
# surge (+1 then -1) hangs in Pending. Stop the old pod first: a few seconds without ingress during a Traefik upgrade.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0
nodeSelector:
  ingress-ready: "true"
service:
  spec:
    type: ClusterIP
ports:
  web:
    hostPort: 80
  websecure:
    hostPort: 443
ingressClass:
  enabled: true
  isDefaultClass: true
providers:
  kubernetesIngress:
    enabled: true
    # Write an address into Ingress status.loadBalancer. Copying it from the Service (publishedService) leaves it
    # empty here (ClusterIP has no load balancer status), and Argo CD then reports every Ingress as Progressing
    # forever. 127.0.0.1 is the truth on this setup: Ingresses are reached on localhost via kind extraPortMappings.
    publishedService:
      enabled: false
    ingressEndpoint:
      ip: 127.0.0.1
  kubernetesCRD:
    enabled: false   # we only use standard Ingress resources (YAGNI)
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 128Mi
