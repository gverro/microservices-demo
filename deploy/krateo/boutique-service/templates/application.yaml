# One Argo CD Application per team environment: Argo CD stays the only component that applies the app,
# so history, rollback and drift detection work as for dev and prod (deploy/argocd/boutique-<env>.yaml).
{{- /* Cross-field rules (a CRD schema has no if/then): the host belongs to the team namespace, so a team cannot take
       dev.boutique.localhost or another team's host; prod and tier critical keep at least two frontend replicas, as values-prod.yaml does. */ -}}
{{- if not (hasPrefix (printf "%s." .Values.namespace) .Values.ingress.host) }}
{{- fail (printf "ingress.host must start with the namespace: %s.boutique.localhost (got %s)" .Values.namespace .Values.ingress.host) }}
{{- end }}
{{- $replicas := int .Values.resources.frontendReplicas }}
{{- if and (or (eq .Values.tier "critical") (eq .Values.environment "prod")) (lt $replicas 2) }}{{ $replicas = 2 }}{{ end }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique-{{ .Values.namespace }}
  namespace: argocd
  labels:
    {{- include "boutique-service.labels" . | nindent 4 }}
  finalizers:
    # Deleting the Application (helm uninstall of the Composition) also deletes the resources it deployed.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: tenants
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.namespace }}
  sources:
    - repoURL: {{ .Values.source.repoURL | quote }}
      targetRevision: {{ .Values.source.revision | quote }}
      path: helm-chart
      helm:
        releaseName: onlineboutique
        valueFiles:
          - $repo/deploy/values-common.yaml
          - $repo/deploy/values-{{ .Values.environment }}.yaml
        # Consumer choices; in Argo CD valuesObject takes precedence over valueFiles.
        valuesObject:
          frontend:
            replicas: {{ $replicas }}
            ingress:
              host: {{ .Values.ingress.host | quote }}
          loadGenerator:
            create: {{ .Values.loadGenerator }}
    # Same repository, named "repo" for the value files above; its path holds the namespace's SealedSecret (redis-auth).
    - repoURL: {{ .Values.source.repoURL | quote }}
      targetRevision: {{ .Values.source.revision | quote }}
      ref: repo
      path: deploy/secrets/{{ .Values.namespace }}
  {{- if and (eq .Values.environment "dev") (not (include "boutique-service.paused" .)) }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  {{- else }}
  # prod (or a paused Composition): no automatic sync, a person promotes with a manual sync.
  syncPolicy: {}
  {{- end }}
