# kind cluster for the Kiratech challenge (local environment).
# Single node on purpose: enough for dev + prod namespaces within the WSL RAM budget.
# The node image is pinned by digest (from the kind v0.33.0 release notes) for reproducibility.
# Ports 80/443 of the node are published on the host (WSL localhost, forwarded to Windows):
# the Traefik ingress controller listens there via hostPort. Port mappings can only be set at creation time.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: boutique
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        listenAddress: "127.0.0.1"
        protocol: TCP
